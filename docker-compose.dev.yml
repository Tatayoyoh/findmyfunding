services:
  findmyfundings:
    build: .
    container_name: findmyfundings
    restart: unless-stopped
    env_file: .env
    environment:
      FIRECRAWL_API_URL: http://firecrawl-api:3002
    depends_on:
      firecrawl-api:
        condition: service_started
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts/:ro
      - db-data:/app/data
    ports:
      - 8000:8000
    command: uv run fastapi dev --host 0.0.0.0
    networks:
      - firecrawl-backend

  # === Firecrawl self-hosted stack ===

  firecrawl-playwright:
    build: ./firecrawl/apps/playwright-service-ts
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - firecrawl-backend
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  firecrawl-api:
    build: ./firecrawl/apps/api
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      ENV: local
      HARNESS_STARTUP_TIMEOUT_MS: 60000
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      USE_DB_AUTHENTICATION: "false"
      NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
      CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-3}
      # DeepSeek via OpenAI-compatible API
      OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
    ports:
      - "${FIRECRAWL_HOST_PORT:-3002}:3002"
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
    networks:
      - firecrawl-backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  firecrawl-redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
    networks:
      - firecrawl-backend
    volumes:
      - firecrawl-redis-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - firecrawl-backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  firecrawl-postgres:
    build: ./firecrawl/apps/nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    networks:
      - firecrawl-backend
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  db-data:
  firecrawl-redis-data:
  firecrawl-postgres-data:

networks:
  firecrawl-backend:
    driver: bridge
