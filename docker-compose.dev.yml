services:
  findmyfundings:
    build: .
    container_name: findmyfundings
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts/:ro
      - db-data:/app/data
    ports:
      - 8000:8000
    command: uv run fastapi dev --host 0.0.0.0

  # Recompile Tailwind CSS à chaque modif de template (binaire standalone monté depuis l'hôte)
  tailwind:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./tools:/app/tools:ro
    command: ./tools/tailwindcss -i src/static/css/input.css -o src/static/css/app.css --watch

volumes:
  db-data:
