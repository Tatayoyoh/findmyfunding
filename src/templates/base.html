<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FindMyFundings{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/lucide.min.js"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight">FindMyFundings</a>
            <div class="flex gap-6 text-sm">
                <a href="/" class="hover:text-indigo-200 transition">Recherche</a>
                <a href="/admin" class="hover:text-indigo-200 transition">Administration</a>
                <a href="/api/programs" class="hover:text-indigo-200 transition">API</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t mt-12 py-6 text-center text-gray-500 text-sm">
        FindMyFundings &mdash; Cartographie des financements pour les structures
    </footer>

    {# Toast host : any fragment can inject <template data-toast data-toast-kind="error|success|info"> here #}
    <div id="toast-host" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-md"></div>

    <script>
        lucide.createIcons();

        function showToast(message, kind = "info", durationMs = 6000) {
            const host = document.getElementById('toast-host');
            if (!host) return;
            const colors = {
                error:   'bg-red-50 border-red-200 text-red-700',
                success: 'bg-green-50 border-green-200 text-green-700',
                info:    'bg-indigo-50 border-indigo-200 text-indigo-700',
            };
            const icons = { error: 'alert-triangle', success: 'check-circle-2', info: 'info' };
            const el = document.createElement('div');
            el.className = `flex items-start gap-2 border rounded-lg p-3 shadow-md text-sm transition-opacity duration-300 ${colors[kind] || colors.info}`;
            el.innerHTML = `<i data-lucide="${icons[kind] || icons.info}" class="w-4 h-4 mt-0.5 flex-shrink-0"></i><span class="flex-1">${message}</span><button class="text-current opacity-60 hover:opacity-100" onclick="this.parentElement.remove()">×</button>`;
            host.appendChild(el);
            lucide.createIcons();
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, durationMs);
        }

        function _flushToastTemplates() {
            document.querySelectorAll('#toast-host template[data-toast]').forEach(tpl => {
                showToast(tpl.innerHTML.trim(), tpl.dataset.toastKind || 'info');
                tpl.remove();
            });
        }
        _flushToastTemplates();
        document.body.addEventListener('htmx:afterSwap', () => {
            lucide.createIcons();
            _flushToastTemplates();
        });
    </script>
</body>
</html>
