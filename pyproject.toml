[project]
name = "findmyfundings"
version = "0.1.0"
description = "Application pour aider les structures (associations, ONG, etc.) à trouver des financements"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "apscheduler>=3.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "openai>=2.38.0",
    "instructor>=1.6",
    "trafilatura>=2.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "curl-cffi>=0.7",
    "httpx>=0.27",
    "libsql>=0.1.11",
    "fastapi-cloud-cli>=0.21.0",
]

[project.scripts]
import-excel = "scripts.import_excel:main"
run-scrape = "scripts.run_scrape:main"

[tool.uv]
dev-dependencies = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.fastapi]
entrypoint = "src.main:app"
